name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: armv8
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 打包
        id: build
        run: |
          spk="$(scripts/build-spk.sh ${{ matrix.arch }} ${{ github.run_number }} | tail -n 1)"
          ls -lh "$spk"
          echo "spk=$spk" >> "$GITHUB_OUTPUT"

      - name: 冒烟测试
        run: tests/smoke.sh "${{ steps.build.outputs.spk }}" ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: spk-${{ matrix.arch }}
          path: ${{ steps.build.outputs.spk }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: spk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.spk --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
